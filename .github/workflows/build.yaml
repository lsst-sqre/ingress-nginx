name: Build Controller Containers
on:
  pull_request:
    branches:
      - "*"
jobs:
  short_circuit:
    name: "Short circuit check"
    env:
      REGISTRY: ghcr.io/lsst-sqre
    permissions:
      actions: read
      contents: read
      packages: read
    runs-on: ubuntu-latest
    outputs:
      base_exists: ${{ steps.base_container.exists }}
      nginx_exists: ${{ steps.nginx.exists }}
      tags_equal: ${{ steps.tags.tags_equal }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: base_container
        id: base_container
        run: |
          set -eux -o pipefail
          docker pull $(cat NGINX_BASE)
          rc=$?
          if  [ ${rc} -ne 0 ]; then
              echo "exists=false" >> ${GITHUB_OUTPUT}
          else
              echo "exists=true" >> ${GITHUB_OUTPUT}
          fi
      - name: nginx
        id: nginx
        run: |
          set -eux -o pipefail        
          docker pull ${{ env.REGISTRY }}/nginx:$(cat images/nginx/TAG)
          rc=$?
          if  [ ${rc} -ne 0 ]; then
              echo "exists=false" >> ${GITHUB_OUTPUT}
          else
              echo "exists=true" >> ${GITHUB_OUTPUT}
          fi
      - name: tags
        id: tags
        run: |
          set -eux -o pipefail        
          basetag=$(cat NGINX_BASE | cut -d ':' -f 2)
          nginxtag=$(cat images/nginx/TAG)
          if [ "${basetag}" == "${nginxtag}" ]; then
              echo "tags_equal=true" >> ${GITHUB_OUTPUT}
          else
              echo "tags_equal=false" >> ${GITHUB_OUTPUT}
          fi
          
  changes:
    name: Changes
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      baseimage: ${{ steps.filter.outputs.baseimage }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            baseimage:
              - 'NGINX_BASE'
              - 'images/nginx/**'


  build_nginx_container:
    name: Build NGINX base container
    needs: [short_circuit, changes]
    if: |
      (needs.changes.outputs.baseimage == 'true') || ((needs.short_circuit.outputs.nginx_exists == 'false') && (needs.short_circuit.outputs.tags_equal == 'true'))    
    permissions:
      actions: write
      contents: read
      packages: write
      statuses: read
    runs-on: ubuntu-latest
    outputs:
      golangversion: ${{ steps.golangversion.outputs.version }}
    env:
      PLATFORMS: linux/amd64,linux/arm64
      REGISTRY: ghcr.io/lsst-sqre
      
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Get go version
        id: golangversion
        run: |
          echo "version=$(cat GOLANG_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        id: go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.golangversion.outputs.version }}
          check-latest: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build_nginx
        run: |
          export TAG=$(cat images/nginx/TAG)
          cd images/nginx/rootfs && docker buildx build --platform=${{ env.PLATFORMS }} --push -t ${{ env.REGISTRY }}/nginx:${TAG} .

  build_dependent_controller_container:
    name: Build ingress-nginx controller (after NGINX base)
    needs: [build_nginx_container, short_circuit]
    if: |
      (needs.short_circuit.tags_equal == 'true')
    runs-on: ubuntu-latest
    outputs:
      golangversion: ${{ steps.golangversion.outputs.version }}
    env:
      REGISTRY: "ghcr.io/lsst-sqre"
    permissions:
      actions: write
      contents: write
      packages: write
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build-controller
        run: |
          echo "building controller images..."
          make release

  build_independent_controller_container:
    name: Build ingress-nginx controller (only)
    needs: short_circuit
    if: |
      (needs.short_circuit.outputs.base_exists == 'true')
    runs-on: ubuntu-latest
    outputs:
      golangversion: ${{ steps.golangversion.outputs.version }}
    env:
      REGISTRY: "ghcr.io/lsst-sqre"
    permissions:
      actions: write
      contents: write
      packages: write
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build-controller
        run: |
          echo "building controller images..."
          make release
